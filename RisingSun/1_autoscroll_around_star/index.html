<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Immersive Revolving Star Rays</title>
<style>
  html, body {
    height: 100%;
    width: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden; /* hide scrollbars completely */
  }

  body {
    background: #FFF8E7; /* soft egg-white */
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #hero {
    height: 100vh;
    width: 100vw;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  svg {
    display: block;
    width: 100vw;
    height: 100vh;
    user-select: none;
    -webkit-user-select: none;
  }
</style>
</head>
<body>

<section id="hero" aria-label="Revolving star rays">
  <svg viewBox="-500 -500 1000 1000" preserveAspectRatio="xMidYMid meet"
       xmlns="http://www.w3.org/2000/svg" role="img">

    <rect x="-500" y="-500" width="1000" height="1000" fill="#FFF8E7"/>

    <g id="scene">
      <!-- Rays orbit group -->
      <g id="raysOrbit" fill="#E31B23">
        <!-- Dramatically longer diamond-shaped rays -->
        <!-- You can adjust 1200 or 1500 for even longer reach -->
        <g transform="rotate(0)">
          <path d="M140 0 L1200 -80 L1500 0 L1200 80 Z" />
        </g>
        <g transform="rotate(15)">
          <path d="M140 0 L1200 -80 L1500 0 L1200 80 Z" />
        </g>
        <g transform="rotate(30)">
          <path d="M140 0 L1200 -80 L1500 0 L1200 80 Z" />
        </g>
        <g transform="rotate(45)">
          <path d="M140 0 L1200 -80 L1500 0 L1200 80 Z" />
        </g>
        <g transform="rotate(60)">
          <path d="M140 0 L1200 -80 L1500 0 L1200 80 Z" />
        </g>
        <g transform="rotate(75)">
          <path d="M140 0 L1200 -80 L1500 0 L1200 80 Z" />
        </g>
        <g transform="rotate(90)">
          <path d="M140 0 L1200 -80 L1500 0 L1200 80 Z" />
        </g>
        <g transform="rotate(105)">
          <path d="M140 0 L1200 -80 L1500 0 L1200 80 Z" />
        </g>
        <g transform="rotate(120)">
          <path d="M140 0 L1200 -80 L1500 0 L1200 80 Z" />
        </g>
        <g transform="rotate(135)">
          <path d="M140 0 L1200 -80 L1500 0 L1200 80 Z" />
        </g>
        <g transform="rotate(150)">
          <path d="M140 0 L1200 -80 L1500 0 L1200 80 Z" />
        </g>
        <g transform="rotate(165)">
          <path d="M140 0 L1200 -80 L1500 0 L1200 80 Z" />
        </g>
        <g transform="rotate(180)">
          <path d="M140 0 L1200 -80 L1500 0 L1200 80 Z" />
        </g>
        <g transform="rotate(195)">
          <path d="M140 0 L1200 -80 L1500 0 L1200 80 Z" />
        </g>
        <g transform="rotate(210)">
          <path d="M140 0 L1200 -80 L1500 0 L1200 80 Z" />
        </g>
        <g transform="rotate(225)">
          <path d="M140 0 L1200 -80 L1500 0 L1200 80 Z" />
        </g>
        <g transform="rotate(240)">
          <path d="M140 0 L1200 -80 L1500 0 L1200 80 Z" />
        </g>
        <g transform="rotate(255)">
          <path d="M140 0 L1200 -80 L1500 0 L1200 80 Z" />
        </g>
        <g transform="rotate(270)">
          <path d="M140 0 L1200 -80 L1500 0 L1200 80 Z" />
        </g>
        <g transform="rotate(285)">
          <path d="M140 0 L1200 -80 L1500 0 L1200 80 Z" />
        </g>
        <g transform="rotate(300)">
          <path d="M140 0 L1200 -80 L1500 0 L1200 80 Z" />
        </g>
        <g transform="rotate(315)">
          <path d="M140 0 L1200 -80 L1500 0 L1200 80 Z" />
        </g>
        <g transform="rotate(330)">
          <path d="M140 0 L1200 -80 L1500 0 L1200 80 Z" />
        </g>
        <g transform="rotate(345)">
          <path d="M140 0 L1200 -80 L1500 0 L1200 80 Z" />
        </g>
      </g>

      <!-- Center star -->
      <polygon id="star"
               points="0,-120 35,-35 115,-35 50,20 70,100 0,55 -70,100 -50,20 -115,-35 -35,-35"
               fill="#E31B23" stroke="#b00f16" stroke-width="6" />
    </g>
  </svg>
</section>

<!-- GSAP for smooth infinite rotation -->
<script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
<script>
  // Continuous smooth rotation
  gsap.to("#raysOrbit", {
    rotation: 360,
    ease: "none",
    duration: 60,   // full revolution in 60s (tweak for slower/faster)
    repeat: -1,     // infinite loop
    svgOrigin: "0 0"
  });
</script>
</body>
</html>
