<!doctype html>
<!-- need to change navbar menu x to be black -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Fadugbagbe Phythian — Revolving Star</title>
<style>
  /* Basic page & hidden scrollbar but still scrollable */
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    height: auto;
    overflow-y: auto;              /* allow scrolling */
    scrollbar-width: none;         /* Firefox */
    -ms-overflow-style: none;      /* IE/Edge */
  }
  body::-webkit-scrollbar { display: none; } /* Chrome/Safari */

  body {
    background: #FFF8E7;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    color: #222;
  }

  /* fixed header on top of the SVG (high z-index) */
  header {
    position: fixed;
    top: 16px;
    left: 16px;
    right: 16px;
    height: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none; /* let inner controls decide pointer events */
    z-index: 60; /* MUST be above the pinned hero */
  }

  .brand {
    pointer-events: auto;
    color: #000;            /* black names as requested */
    font-weight: 700;
    line-height: 1.05;
    font-size: 1.05rem;
    text-transform: none;
  }

  /* hamburger container (top-right) */
  .controls {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .menu-toggle {
    width: 36px;
    height: 26px;
    position: relative;
    cursor: pointer;
    display: inline-block;
  }
  .menu-toggle span {
    position: absolute;
    left: 0;
    right: 0;
    height: 3px;
    background: #000;
    border-radius: 2px;
    transition: transform .28s ease, top .28s ease, opacity .2s ease;
  }
  .menu-toggle span:nth-child(1){ top: 0; }
  .menu-toggle span:nth-child(2){ top: 11.5px; }
  .menu-toggle span:nth-child(3){ top: 23px; }

  .menu-toggle.open span:nth-child(1){
    transform: rotate(45deg);
    top: 11.5px;
  }
  .menu-toggle.open span:nth-child(2){
    opacity: 0;
  }
  .menu-toggle.open span:nth-child(3){
    transform: rotate(-45deg);
    top: 11.5px;
  }

  /* slide-in nav (right) */
  nav {
    position: fixed;
    right: 0;
    top: 0;
    height: 100vh;
    width: 220px;
    background: rgba(255,248,231,0.98);
    box-shadow: -8px 0 30px rgba(0,0,0,0.08);
    transform: translateX(110%);
    transition: transform .36s cubic-bezier(.22,.9,.3,1);
    z-index: 70;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 18px;
    padding: 40px 12px;
  }
  nav.open { transform: translateX(0); }

  nav a {
    color: #E31B23;
    text-decoration: none;
    font-weight: 700;
    font-size: 1.05rem;
  }

  /* hero (pinned) and svg should be behind header */
  #hero {
    position: relative;
    height: 100vh;
    width: 100%;
    overflow: hidden;
    z-index: 10;
  }

  svg {
    display: block;
    width: 100vw;
    height: 100vh;
    user-select: none;
    -webkit-user-select: none;
  }

  /* panels after hero to provide scroll distance (still hidden scrollbar) */
  .panel {
    height: 120vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(18px, 3vw, 28px);
  }

  /* small responsive tweak so header content never overlaps badly on tiny screens */
  @media (max-width:520px){
    .brand { font-size: .95rem; }
    nav { width: 180px; padding: 30px 8px; }
  }
</style>
</head>
<body>

  <!-- header: brand left, hamburger right -->
  <header>
    <div class="brand" aria-hidden="false">Fadugbagbe<br>Phythian</div>

    <div class="controls" aria-hidden="false">
      <div id="menuToggle" class="menu-toggle" role="button" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </div>
    </div>

    <nav id="navMenu" aria-hidden="true">
      <a href="#about">About</a>
      <a href="#design">Design</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <!-- hero area - pinned and scroll-driven -->
  <section id="hero" aria-label="Revolving star with long rays">
    <svg viewBox="-500 -500 1000 1000" preserveAspectRatio="xMidYMid meet"
         xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="false">

      <rect x="-500" y="-500" width="1000" height="1000" fill="#FFF8E7"/>

      <g id="scene">
        <!-- rays group (diamond-like long rays) -->
        <g id="raysOrbit" fill="#E31B23">
          <!-- Many long diamond-shaped rays. They extend well off-screen -->
          <!-- You can edit the numeric lengths if you want them even longer -->
          <g transform="rotate(0)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
          <g transform="rotate(12)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
          <g transform="rotate(24)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
          <g transform="rotate(36)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
          <g transform="rotate(48)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
          <g transform="rotate(60)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
          <g transform="rotate(72)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
          <g transform="rotate(84)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
          <g transform="rotate(96)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
          <g transform="rotate(108)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
          <g transform="rotate(120)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
          <g transform="rotate(132)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
          <g transform="rotate(144)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
          <g transform="rotate(156)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
          <g transform="rotate(168)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
          <g transform="rotate(180)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
          <g transform="rotate(192)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
          <g transform="rotate(204)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
          <g transform="rotate(216)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
          <g transform="rotate(228)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
          <g transform="rotate(240)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
          <g transform="rotate(252)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
          <g transform="rotate(264)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
          <g transform="rotate(276)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
          <g transform="rotate(288)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
          <g transform="rotate(300)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
          <g transform="rotate(312)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
          <g transform="rotate(324)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
          <g transform="rotate(336)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
          <g transform="rotate(348)"><path d="M140 0 L1600 -100 L1800 0 L1600 100 Z" /></g>
        </g>

        <!-- Center star (still centered at 0,0) -->
        <polygon id="star"
                 points="0,-120 35,-35 115,-35 50,20 70,100 0,55 -70,100 -50,20 -115,-35 -35,-35"
                 fill="#E31B23" stroke="#b00f16" stroke-width="6" />
      </g>
    </svg>
  </section>

  <!-- Content panels (real scroll distance). These plus the dynamic spacer in script
       ensure scroll is always available even in constrained previews. -->
  <div id="about" class="panel">About Section — add your content here</div>
  <div id="design" class="panel">Design Section — add your content here</div>
  <div id="contact" class="panel">Contact Section — add your content here</div>

  <!-- GSAP + ScrollTrigger (loaded from CDN) -->
  <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
  <script src="https://unpkg.com/gsap@3/dist/ScrollTrigger.min.js"></script>
  <script>
    // Defensive: if page lacks enough height (some preview frames do), add a spacer element
    function ensureScrollable(minExtraVH = 300) {
      const needed = Math.max(window.innerHeight * 2.8, minExtraVH * 10);
      if (document.body.scrollHeight <= window.innerHeight + 10) {
        const spacer = document.createElement('div');
        spacer.id = 'auto-spacer';
        spacer.style.height = Math.ceil(needed) + 'px';
        document.body.appendChild(spacer);
        // console.log('Added spacer for scrollability:', spacer.style.height);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Make sure page is scrollable in every environment
      ensureScrollable();

      // Menu behavior
      const menuToggle = document.getElementById('menuToggle');
      const navMenu = document.getElementById('navMenu');
      menuToggle.addEventListener('click', () => {
        const open = menuToggle.classList.toggle('open');
        navMenu.classList.toggle('open', open);
        menuToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        navMenu.setAttribute('aria-hidden', open ? 'false' : 'true');
      });

      // GSAP ScrollTrigger setup
      gsap.registerPlugin(ScrollTrigger);

      // dynamic end distance — long enough to feel cinematic on any viewport
      const endDistance = Math.max(2200, window.innerHeight * 2.5);

      gsap.to("#raysOrbit", {
        rotation: 360,
        ease: "none",
        svgOrigin: "0 0",
        scrollTrigger: {
          trigger: "#hero",
          start: "top top",
          end: "+=" + endDistance,
          scrub: 0.9,
          pin: true,
          anticipatePin: 1
          // markers: true // uncomment while debugging
        }
      });

      // Optional: small breathing effect for the star so the center is subtly alive
      gsap.to("#star", {
        scale: 1.03,
        transformOrigin: "50% 50%",
        repeat: -1,
        yoyo: true,
        duration: 3,
        ease: "sine.inOut"
      });
    });

    // If the user resizes the window, re-evaluate scrollable space & ScrollTrigger
    window.addEventListener('resize', () => {
      ensureScrollable();
      ScrollTrigger.refresh();
    });
  </script>
</body>
</html>
