<!DOCTYPE html>
<html lang="en">
    <style>
        /* @import url('https://fonts.googleapis.com/css2?family=Anton:wght@400&family=Oswald:wght@400;700;800&display=swap'); */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Oswald', 'Arial Black', sans-serif;
            /* cursor: url('chipmunk2.png') 32 32, auto; */
            cursor: url('chipmunk_cursor_32.png') 16 16, auto;

            background: rgba(255, 63, 180, 0.8);
            min-height: 100vh;
            overflow: hidden;
        }

        .main_content {
            width: 66.67%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
    :root{
    /* Gold Spectrum */
    --gold-1: #fffef8;
    --gold-2: #fff4b1;
    --gold-3: #ffd95e;
    --gold-4: #ffbf00;
    --gold-5: #b37b00;
    --gold-6: #5a3d00;

    /* Accent glints */
    --emerald: rgba(4,99,7,0.25);
    --pink: rgba(231,84,128,0.25);
    }

    .gold-bg-crazy{
    display: flex;                  /* use flexbox */
    justify-content: center;        /* horizontal centering */
    align-items: center;            /* vertical centering */
    height: 50%;
    width: 100%;                     /* full width */
    cursor: url('exact_chipmunk32.png') 32 32, auto;
    min-height: 60vh;
    display: grid;
    place-items: center;
    font: 700 2.5rem/1.2 system-ui, sans-serif;
    color: var(--gold-1);
    position: relative;
    overflow: hidden;
    background-size: 300% 300%;     /* for animations */
    animation: goldShimmer 10s infinite linear;

    /* border-radius: 20px; */
    background-color: var(--gold-3); /* fallback */

    background-image:
        /* Iridescent emerald-pink overlay */
        linear-gradient(130deg, var(--emerald), var(--pink)),

        /* Main gold banding — extra high contrast & multiple streaks */
        linear-gradient(145deg,
        var(--gold-6) 0%,
        var(--gold-5) 10%,
        var(--gold-2) 14%,
        var(--gold-3) 18%,
        var(--gold-4) 20%,
        var(--gold-1) 22%, /*bright streak */
        var(--gold-5) 23%,
        var(--gold-6) 24%,
        var(--gold-5) 26%,
        var(--gold-3) 28%,
        var(--gold-1) 32%, /* bright streak 1 */
        var(--gold-2) 34%,
        var(--gold-4) 38%,
        var(--gold-1) 42%, /* bright streak 2 */
        var(--gold-3) 46%,
        var(--gold-5) 55%,
        var(--gold-6) 65%,
        var(--gold-4) 78%,
        var(--gold-1) 84%, /* bright streak 3 */
        var(--gold-5) 92%,
        var(--gold-6) 100%
        ),

        /* Moving sparkle highlight */
        radial-gradient(ellipse at 20% 20%, rgba(255,255,255,0.6), transparent 70%),

        /* Deep shadow vignette */
        radial-gradient(ellipse at 80% 80%, rgba(0,0,0,0.4), transparent 80%),

        /* Fine brushed texture */
        repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.06) 0px,
        rgba(255,255,255,0.06) 2px,
        rgba(0,0,0,0.05) 2px,
        rgba(0,0,0,0.05) 4px
        );

        background-blend-mode:
            overlay,   /* emerald/pink */
            normal,    /* gold bands */
            screen,    /* sparkle */
            multiply,  /* shadow vignette */
            overlay;   /* brushed texture */

        animation: gold-shimmer 8s linear infinite;
        }

        /* Animated shimmer effect */
        @keyframes gold-shimmer{
        0% { background-position: 0% 0%, 0% 0%, 20% 20%, 80% 80%, 0% 0%; }
        100% { background-position: 100% 0%, 100% 0%, 60% 40%, 40% 60%, 0% 0%; }
        }

        .gold-bg-crazy h1{
        backdrop-filter: blur(3px);
        padding: 1rem 2rem;
        border-radius: 14px;
        text-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 20px rgba(255,215,0,0.6);
        }

        .emerald-text {
        cursor: url('exact_chipmunk64.png') 64 64, auto;
        user-select: none;
        -webkit-user-select: none; /* Safari */
        -moz-user-select: none;    /* Firefox */
        -ms-user-select: none;
        font-size: 12rem;
        font-weight: 1500;
        text-transform: uppercase;
        color: rgba(4,99,7,0.25);

        
        /* Neon emerald gradient */
        background: linear-gradient(
            180deg,
            #00ff88 0%,   /* bright neon highlight */
            #00cc66 40%,  /* vibrant emerald */
            #00994d 80%,  /* deep emerald */
            #003d1f 100%  /* dark green shadow */
        );
        background-clip: text;
        -webkit-background-clip: text;

        color: rgba(15, 234, 22, 0.455);
        /* color: rgba(255, 63, 180, 0.8); */


        /* Glow */
        text-shadow:
            0 0 5px #00ff88,
            0 0 10px #00ff88,
            0 0 20px #00ff88,
            0 0 40px #00cc66,
            0 0 80px #00cc66,

            /* 3D shadow layers (bottom-right) */
            2px 2px 0 #002d16,
            4px 4px 0 #001f10,
            6px 6px 0 #00150a,
            8px 8px 0 rgba(0,0,0,0.8);

        /* Extra punch */
        filter: brightness(1.2) contrast(1.3);
        }
        /* .emerald-text:active {
        cursor: url('combined_64.png') 16 16, auto;        
        } */
        .emerald-text:hover {
         cursor: url('combined_64.png') 32 32, auto;
        }

        .poop {
        position: fixed;
        font-size: 32px;
        pointer-events: none;
        animation: shootLeft 1.5s cubic-bezier(0.3, 1, 0.5, 1) forwards;
        }
        @keyframes shootLeft {
        0% {
            transform: translate(-48px, -16px) rotate(0deg);
            opacity: 1;
        }
        40% {
            transform: translate(-134px, -34px) rotate(-90deg); 
            opacity: 1;
        }
        100% {
            transform: translate(-286px, 316px) rotate(-720deg); 
            opacity: 0;
        }
        /* @keyframes shootLeft {
        0% {
            transform: translate(0, 0) rotate(0deg);
            opacity: 1;
        }
        40% {
            transform: translate(-150px, -50px) rotate(-90deg); 
            opacity: 1;
        }
        100% {
            transform: translate(-300px, 300px) rotate(-720deg); 
            opacity: 0;
        } */
        }
        @media (max-width: 600px) {
        .emerald-text {
            font-size: 64px; /* smaller size for mobile */
        }
        }
        @media (max-width: 768px) {
        @keyframes sparkleExplosionMobile {
            0% {
            transform: translate(10%, -10%) scale(0) rotate(0deg);
            opacity: 0;
            background: white;
            }
            20% {
            transform: translate(10%, -10%) scale(1.2) rotate(90deg);
            opacity: 1;
            background: gold;
            }
            40% {
            transform: translate(10%, -10%) scale(0.9) rotate(180deg);
            opacity: 0.9;
            background: limegreen;
            }
            60% {
            transform: translate(10%, -20%) scale(1.4) rotate(270deg);
            opacity: 1;
            background: white;
            }
            80% {
            transform: translate(35%, -45%) scale(0.8) rotate(360deg);
            opacity: 0.6;
            background: gold;
            }
            100% {
            transform: translate(50%, -75%) scale(0) rotate(450deg);
            opacity: 0;
            background: white;
            }
        }

        /* Force sparkle elements to use the smaller mobile animation */
        .sparkle::after {
            animation-name: sparkleExplosionMobile !important;
        }
        }
            
        @keyframes goldShimmer {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
        50% { background-position: 50% 0%; }
        /* 0% { background-position: 0% 50%; } */
        }
.emerald-text span {
  position: relative;
  display: inline-block;
  transform-origin: center center;
  animation: wobble 3s ease-in-out infinite;
}
.emerald-text .letter {
  display: inline-block;
}
.sparkle::after {
  content: '';
  position: absolute;
  top: 20%;
  left: 30%;
  transform: translate(-25%, -25%) scale(0) rotate(0deg);
  width: 24px;
  height: 24px;
  background: white;
  clip-path: polygon(
    50% 0%, 65% 35%, 100% 50%, 65% 65%,
    50% 100%, 35% 65%, 0% 50%, 35% 35%
  );
  box-shadow:
    0 0 8px 3px gold,
    0 0 16px 5px rgba(0, 255, 127, 0.8),
    0 0 24px 8px rgba(255, 255, 255, 0.6);
  mix-blend-mode: screen;
  opacity: 0;
  animation: sparkleExplosion 2.5s infinite ease-in-out;
}

@keyframes sparkleExplosion {
  0% {
    transform: translate(0%, -10%) scale(0) rotate(0deg);
    opacity: 0;
    background: white;
  }
  20% {
    transform: translate(0%, -10%) scale(2) rotate(90deg);
    opacity: 1;
    background: gold;
  }
  40% {
    transform: translate(0%, -10%) scale(1.3) rotate(180deg);
    opacity: 0.9;
    background: limegreen;
  }
  60% {
    transform: translate(0%, -20%) scale(2.2) rotate(270deg);
    opacity: 1;
    background: white;
  }
  80% {
    transform: translate(25%, -45%) scale(1) rotate(360deg);
    opacity: 0.6;
    background: gold;
  }
  100% {
    transform: translate(50%, -75%) scale(0) rotate(450deg);
    opacity: 0;
    background: white;
  }
}
@keyframes wobble {
  0%, 100% { transform: rotate(var(--base-rot)); }
  50% { transform: rotate(calc(var(--base-rot) + var(--wobble-amt))); }
}

/* Random delays so they don't all sparkle at once */
.sparkle:nth-of-type(1)::after { animation-delay: 0s; }
.sparkle:nth-of-type(2)::after { animation-delay: 0.7s; }
.sparkle:nth-of-type(3)::after { animation-delay: 1.4s; }
.ring {
  position: absolute;
  pointer-events: none; /* So clicks pass through */
  animation: float 3s ease-in-out forwards;
}

@keyframes float {
  0%   { transform: scale(0) rotate(0deg); opacity: 0; }
  20%  { opacity: 1; }
  100% { transform: scale(1.5) rotate(360deg); opacity: 0; }
}
</style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Chipmunk Cursor</title>
</head>
<body>
    
    <div class="main_content">
        <!-- <h1>Emerald Dusk</h1> -->
    </div>
    <!-- Demo markup -->
    <div class="gold-bg">
        <!-- <h1>Emerald–Gold–Pink Theme</h1> -->
    </div>
    <div class="gold-bg-crazy">
        <div class="emerald-text">
    <h1>
    <div class="emerald-text" id="emerald">
        <span class="sparkle"><span class="letter">E</span></span>
        <span><span class="letter">m</span></span>
        <span><span class="letter">e</span></span>
        <span class="sparkle"><span class="letter">r</span></span>
        <span><span class="letter">a</span></span>
        <span><span class="letter">l</span></span>
        <span><span class="letter">d</span></span>
        <span> </span>
        <span class="sparkle"><span class="letter">D</span></span>
        <span><span class="letter">u</span></span>
        <span><span class="letter">s</span></span>
        <span class="sparkle"><span class="letter">k</span></span>
    </div>
    </h1>
    </div>
    <div class="main_content">
        <!-- <h1>Emerald Dusk</h1> -->
    </div>
    </div>
</body>
<script>
    const text = document.querySelector('.emerald-text');

document.addEventListener('mousemove', (e) => {
  const rect = text.getBoundingClientRect();
  const x = e.clientX - rect.left;   // Mouse X relative to element
  const y = e.clientY - rect.top;    // Mouse Y relative to element
  const centerX = rect.width / 2;
  const centerY = rect.height / 2;

  // Distance from center (normalized -1 to 1)
  const moveX = (x - centerX) / centerX;
  const moveY = (y - centerY) / centerY;

  // Scale slightly more if near center
  const distanceFromCenter = Math.sqrt(moveX**2 + moveY**2);
  const scale = 1 + (0.15 * (1 - distanceFromCenter)); // Max inflate at center

  // Tilt toward cursor
  const rotateX = moveY * 10; // up/down tilt
  const rotateY = -moveX * 10; // left/right tilt

  text.style.transform = `scale(${scale}) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
});



document.querySelector('.emerald-text').addEventListener('click', function(e) {
  const poop = document.createElement('div');
  poop.className = 'poop';
  poop.textContent = '💩';

  // Position at mouse click
  poop.style.left = `${e.clientX}px`;
  poop.style.top = `${e.clientY}px`;

  document.body.appendChild(poop);

  // Remove after animation
  poop.addEventListener('animationend', () => {
    poop.remove();
  });
});
document.querySelectorAll('#emerald > span').forEach(span => {
  let baseRot = (Math.random() * 30 - 15).toFixed(2) + 'deg';
  let wobbleAmt = (Math.random() * 10 - 5).toFixed(2) + 'deg';
  let duration = (2 + Math.random() * 2).toFixed(2) + 's';
  
  span.style.setProperty('--base-rot', baseRot);
  span.style.setProperty('--wobble-amt', wobbleAmt);
  span.style.animationDuration = duration;
});
function spawnRing() {
  const ring = document.createElement('img');

  // Pick one of the two images randomly
  const imgSrc = Math.random() < 0.5 ? 'cropped_golden_ring.png' : 'cropped_golden_ring2.png';
  ring.src = imgSrc;
  ring.className = 'ring';

  // Random position in viewport
  const x = Math.random() * window.innerWidth;
  const y = Math.random() * window.innerHeight;
  ring.style.left = `${x}px`;
  ring.style.top = `${y}px`;

  // Optional random size
  const size = 40 + Math.random() * 80; // 40–120 px
  ring.style.width = `${size}px`;
  ring.style.height = 'auto';

  document.body.appendChild(ring);

  // Remove after animation ends
  setTimeout(() => ring.remove(), 3000);
}

// Spawn a new ring every 300ms
setInterval(spawnRing, 300);
</script>

</html>
