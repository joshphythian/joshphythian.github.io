<!DOCTYPE html>
<html lang="en">
    <style>
        /* @import url('https://fonts.googleapis.com/css2?family=Anton:wght@400&family=Oswald:wght@400;700;800&display=swap'); */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Oswald', 'Arial Black', sans-serif;
            /* cursor: url('chipmunk2.png') 32 32, auto; */
            cursor: url('chipmunk_cursor_32.png') 16 16, auto;

            background: rgba(255, 63, 180, 0.8);
            min-height: 100vh;
            overflow: hidden;
        }

        .main_content {
            width: 66.67%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
    :root{
    /* Gold Spectrum */
    --gold-1: #fffef8;
    --gold-2: #fff4b1;
    --gold-3: #ffd95e;
    --gold-4: #ffbf00;
    --gold-5: #b37b00;
    --gold-6: #5a3d00;

    /* Accent glints */
    --emerald: rgba(4,99,7,0.25);
    --pink: rgba(231,84,128,0.25);
    }

    .gold-bg-crazy{
    cursor: url('exact_chipmunk32.png') 32 32, auto;
    min-height: 60vh;
    display: grid;
    place-items: center;
    font: 700 2.5rem/1.2 system-ui, sans-serif;
    color: var(--gold-1);
    position: relative;
    overflow: hidden;
    /* border-radius: 20px; */
    background-color: var(--gold-3); /* fallback */

    background-image:
        /* Iridescent emerald-pink overlay */
        linear-gradient(130deg, var(--emerald), var(--pink)),

        /* Main gold banding — extra high contrast & multiple streaks */
        linear-gradient(145deg,
        var(--gold-6) 0%,
        var(--gold-5) 10%,
        var(--gold-4) 20%,
        var(--gold-1) 22%, /*bright streak */
        var(--gold-3) 28%,
        var(--gold-1) 32%, /* bright streak 1 */
        var(--gold-2) 34%,
        var(--gold-4) 38%,
        var(--gold-1) 42%, /* bright streak 2 */
        var(--gold-3) 46%,
        var(--gold-5) 55%,
        var(--gold-6) 65%,
        var(--gold-4) 78%,
        var(--gold-1) 84%, /* bright streak 3 */
        var(--gold-5) 92%,
        var(--gold-6) 100%
        ),

        /* Moving sparkle highlight */
        radial-gradient(ellipse at 20% 20%, rgba(255,255,255,0.6), transparent 70%),

        /* Deep shadow vignette */
        radial-gradient(ellipse at 80% 80%, rgba(0,0,0,0.4), transparent 80%),

        /* Fine brushed texture */
        repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.06) 0px,
        rgba(255,255,255,0.06) 2px,
        rgba(0,0,0,0.05) 2px,
        rgba(0,0,0,0.05) 4px
        );

        background-blend-mode:
            overlay,   /* emerald/pink */
            normal,    /* gold bands */
            screen,    /* sparkle */
            multiply,  /* shadow vignette */
            overlay;   /* brushed texture */

        animation: gold-shimmer 8s linear infinite;
        }

        /* Animated shimmer effect */
        @keyframes gold-shimmer{
        0% { background-position: 0% 0%, 0% 0%, 20% 20%, 80% 80%, 0% 0%; }
        100% { background-position: 100% 0%, 100% 0%, 60% 40%, 40% 60%, 0% 0%; }
        }

        .gold-bg-crazy h1{
        backdrop-filter: blur(3px);
        padding: 1rem 2rem;
        border-radius: 14px;
        text-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 20px rgba(255,215,0,0.6);
        }

        .emerald-text {
        cursor: url('exact_chipmunk64.png') 64 64, auto;

        font-size: 7rem;
        font-weight: 1500;
        text-transform: uppercase;
        color: rgba(4,99,7,0.25);

        
        /* Neon emerald gradient */
        background: linear-gradient(
            180deg,
            #00ff88 0%,   /* bright neon highlight */
            #00cc66 40%,  /* vibrant emerald */
            #00994d 80%,  /* deep emerald */
            #003d1f 100%  /* dark green shadow */
        );
        background-clip: text;
        -webkit-background-clip: text;

        color: rgba(15, 234, 22, 0.455);
        /* color: rgba(255, 63, 180, 0.8); */


        /* Glow */
        text-shadow:
            0 0 5px #00ff88,
            0 0 10px #00ff88,
            0 0 20px #00ff88,
            0 0 40px #00cc66,
            0 0 80px #00cc66,

            /* 3D shadow layers (bottom-right) */
            2px 2px 0 #002d16,
            4px 4px 0 #001f10,
            6px 6px 0 #00150a,
            8px 8px 0 rgba(0,0,0,0.8);

        /* Extra punch */
        filter: brightness(1.2) contrast(1.3);
        }
        /* .emerald-text:active {
        cursor: url('combined_64.png') 16 16, auto;        
        } */
        .emerald-text:hover {
         cursor: url('combined_64.png') 32 32, auto;
        }

        .poop {
        position: fixed;
        font-size: 32px;
        pointer-events: none;
        animation: shootLeft 1.5s cubic-bezier(0.3, 1, 0.5, 1) forwards;
        }
        @keyframes shootLeft {
        0% {
            transform: translate(-48px, -16px) rotate(0deg);
            opacity: 1;
        }
        40% {
            transform: translate(-134px, -34px) rotate(-90deg); 
            opacity: 1;
        }
        100% {
            transform: translate(-286px, 316px) rotate(-720deg); 
            opacity: 0;
        }
        /* @keyframes shootLeft {
        0% {
            transform: translate(0, 0) rotate(0deg);
            opacity: 1;
        }
        40% {
            transform: translate(-150px, -50px) rotate(-90deg); 
            opacity: 1;
        }
        100% {
            transform: translate(-300px, 300px) rotate(-720deg); 
            opacity: 0;
        } */
        }
        @media (max-width: 600px) {
        .emerald-text {
            font-size: 48px; /* smaller size for mobile */
        }
        }
</style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Chipmunk Cursor</title>
</head>
<body>
    
    <div class="main_content">
        <!-- <h1>Emerald Dusk</h1> -->
    </div>
    <!-- Demo markup -->
    <div class="gold-bg">
        <!-- <h1>Emerald–Gold–Pink Theme</h1> -->
    </div>
    <div class="gold-bg-crazy">
        <div class="emerald-text">
    <h1>Emerald Dusk</h1>
    </div>
    </div>
</body>
<script>
    const text = document.querySelector('.emerald-text');

document.addEventListener('mousemove', (e) => {
  const rect = text.getBoundingClientRect();
  const x = e.clientX - rect.left;   // Mouse X relative to element
  const y = e.clientY - rect.top;    // Mouse Y relative to element
  const centerX = rect.width / 2;
  const centerY = rect.height / 2;

  // Distance from center (normalized -1 to 1)
  const moveX = (x - centerX) / centerX;
  const moveY = (y - centerY) / centerY;

  // Scale slightly more if near center
  const distanceFromCenter = Math.sqrt(moveX**2 + moveY**2);
  const scale = 1 + (0.15 * (1 - distanceFromCenter)); // Max inflate at center

  // Tilt toward cursor
  const rotateX = moveY * 10; // up/down tilt
  const rotateY = -moveX * 10; // left/right tilt

  text.style.transform = `scale(${scale}) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
});



document.querySelector('.emerald-text').addEventListener('click', function(e) {
  const poop = document.createElement('div');
  poop.className = 'poop';
  poop.textContent = '💩';

  // Position at mouse click
  poop.style.left = `${e.clientX}px`;
  poop.style.top = `${e.clientY}px`;

  document.body.appendChild(poop);

  // Remove after animation
  poop.addEventListener('animationend', () => {
    poop.remove();
  });
});
</script>

</html>
