<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sushi Easy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Libre+Baskerville:wght@400&family=Crimson+Text:wght@400;600&family=EB+Garamond:wght@400;500&family=Spectral:wght@300;400&family=Judson:wght@400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Playfair Display', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: 
                linear-gradient(90deg, transparent 0%, rgba(139, 119, 101, 0.02) 50%, transparent 100%),
                repeating-linear-gradient(0deg, rgba(101, 84, 69, 0.03) 0px, rgba(101, 84, 69, 0.03) 1px, transparent 1px, transparent 3px),
                repeating-linear-gradient(90deg, rgba(139, 119, 101, 0.04) 0px, transparent 2px, transparent 8px, rgba(139, 119, 101, 0.04) 10px),
                repeating-linear-gradient(0deg, transparent 0px, rgba(120, 100, 85, 0.02) 1px, transparent 2px, transparent 80px),
                linear-gradient(180deg, #e8dcc8 0%, #d9cdb9 50%, #cabea8 100%);
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(139, 119, 101, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(101, 84, 69, 0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .hamburger {
            position: fixed;
            top: 30px;
            right: 30px;
            width: 40px;
            height: 40px;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .hamburger span {
            width: 30px;
            height: 2px;
            background: #3d3d3d;
            transition: all 0.3s ease;
        }

        .hamburger.active span:nth-child(1) {
            transform: translateY(8px) rotate(45deg);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: translateY(-8px) rotate(-45deg);
        }

        .menu {
            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100vh;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: -2px 0 10px rgba(0, 0, 0, 0.1);
            transition: right 0.3s ease;
            z-index: 999;
            padding: 100px 40px;
        }

        .menu.active {
            right: 0;
        }

        .menu a {
            display: block;
            padding: 15px 0;
            color: #3d3d3d;
            text-decoration: none;
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 2px;
            transition: color 0.3s ease;
            border-bottom: 1px solid rgba(61, 61, 61, 0.1);
        }

        .menu a:hover {
            color: #8b7765;
        }

        .main-content {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .title-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            font-size: 72px;
            font-weight: 400;
            letter-spacing: 8px;
            color: #3d3d3d;
        }

        .title-container img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .font-selector {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }

        .font-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid #8b7765;
            color: #3d3d3d;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .font-btn:hover {
            background: #8b7765;
            color: white;
        }

        .font-btn.active {
            background: #3d3d3d;
            color: white;
            border-color: #3d3d3d;
        }

        @media (max-width: 768px) {
            .title-container {
                font-size: 48px;
                gap: 20px;
            }

            .title-container img {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="hamburger" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <nav class="menu">
        <a href="#about">About</a>
        <a href="#menu">Menu</a>
        <a href="#visit">Visit</a>
        <a href="#gallery">Gallery</a>
        <a href="#contact">Contact</a>
    </nav>

    <div class="main-content">
        <div class="title-container">
            <span>sushi</span>
            <img src="miso_soup.jpg" alt="Miso Soup" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22120%22 height=%22120%22%3E%3Crect fill=%22%23d4c5b0%22 width=%22120%22 height=%22120%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%233d3d3d%22 font-family=%22sans-serif%22 font-size=%2214%22%3Emiso_soup.jpg%3C/text%3E%3C/svg%3E'">
            <span>easy</span>
        </div>

        <div class="font-selector">
            <button class="font-btn active" onclick="changeFont('Playfair Display')">Playfair</button>
            <button class="font-btn" onclick="changeFont('Libre Baskerville')">Baskerville</button>
            <button class="font-btn" onclick="changeFont('Crimson Text')">Crimson</button>
            <button class="font-btn" onclick="changeFont('EB Garamond')">Garamond</button>
            <button class="font-btn" onclick="changeFont('Spectral')">Spectral</button>
            <button class="font-btn" onclick="changeFont('Judson')">Judson</button>
        </div>
    </div>

    <script>
        function toggleMenu() {
            const hamburger = document.querySelector('.hamburger');
            const menu = document.querySelector('.menu');
            hamburger.classList.toggle('active');
            menu.classList.toggle('active');
        }

        function changeFont(font) {
            document.body.style.fontFamily = `'${font}', serif`;
            
            const btns = document.querySelectorAll('.font-btn');
            btns.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        document.querySelectorAll('.menu a').forEach(link => {
            link.addEventListener('click', () => {
                toggleMenu();
            });
        });
    </script>
</body>
</html>
