<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lauren Lien</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton:wght@400&family=Oswald:wght@400;700;800&family=Bebas+Neue:wght@400&family=Black+Ops+One:wght@400&family=Bungee:wght@400&family=Righteous:wght@400&family=Creepster:wght@400&family=Monoton:wght@400&family=Orbitron:wght@400;700;900&family=Audiowide:wght@400&family=Share+Tech+Mono:wght@400&family=Rajdhani:wght@400;600;700&family=Work+Sans:wght@400;600;800&family=Inter:wght@400;600;800&family=Roboto:wght@400;700;900&family=Lato:wght@400;700;900&family=Source+Sans+Pro:wght@400;600;900&family=Playfair+Display:wght@400;700;900&family=Crimson+Text:wght@400;600;700&family=Libre+Baskerville:wght@400;700&family=Cormorant+Garamond:wght@400;600;700&family=Dancing+Script:wght@400;700&family=Pacifico:wght@400&family=Amatic+SC:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Oswald', 'Arial Black', sans-serif;
            background: #ececec;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Font Switcher Styles */
        .font-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 1001;
        }

        .font-btn {
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #c82333;
            color: #ffffff;
            font-family: 'Oswald', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="%23c82333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'), auto;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
            letter-spacing: 1px;
            text-align: center;
            min-width: 80px;
        }

        .font-btn:hover {
            background: #c82333;
            transform: translateX(-3px) translateY(-2px);
            box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.8);
        }

        .font-btn.active {
            background: #c82333;
            box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.5);
        }

        /* Font families for switching */
        .font-brutalist-1 { font-family: 'Anton', 'Arial Black', sans-serif !important; }
        .font-brutalist-2 { font-family: 'Bebas Neue', 'Arial Black', sans-serif !important; }
        .font-brutalist-3 { font-family: 'Black Ops One', 'Arial Black', sans-serif !important; }
        .font-brutalist-4 { font-family: 'Bungee', 'Arial Black', sans-serif !important; }
        .font-brutalist-5 { font-family: 'Righteous', 'Arial Black', sans-serif !important; }

        .font-artsy-1 { font-family: 'Creepster', 'Georgia', serif !important; }
        .font-artsy-2 { font-family: 'Monoton', 'Georgia', serif !important; }
        .font-artsy-3 { font-family: 'Dancing Script', 'Georgia', serif !important; }
        .font-artsy-4 { font-family: 'Pacifico', 'Georgia', serif !important; }
        .font-artsy-5 { font-family: 'Amatic SC', 'Georgia', serif !important; }

        .font-corporate-1 { font-family: 'Inter', 'Helvetica', sans-serif !important; }
        .font-corporate-2 { font-family: 'Roboto', 'Helvetica', sans-serif !important; }
        .font-corporate-3 { font-family: 'Lato', 'Helvetica', sans-serif !important; }
        .font-corporate-4 { font-family: 'Work Sans', 'Helvetica', sans-serif !important; }
        .font-corporate-5 { font-family: 'Source Sans Pro', 'Helvetica', sans-serif !important; }

        .font-tech-1 { font-family: 'Orbitron', 'Courier New', monospace !important; }
        .font-tech-2 { font-family: 'Audiowide', 'Courier New', monospace !important; }
        .font-tech-3 { font-family: 'Share Tech Mono', 'Courier New', monospace !important; }
        .font-tech-4 { font-family: 'Rajdhani', 'Courier New', monospace !important; }

        .font-elegant-1 { font-family: 'Playfair Display', 'Georgia', serif !important; }
        .font-elegant-2 { font-family: 'Crimson Text', 'Georgia', serif !important; }
        .font-elegant-3 { font-family: 'Libre Baskerville', 'Georgia', serif !important; }
        .font-elegant-4 { font-family: 'Cormorant Garamond', 'Georgia', serif !important; }

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(236, 236, 236, 0.95);
            backdrop-filter: blur(15px);
            border-top: 2px solid rgba(0, 0, 0, 0.8);
            padding: 15px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            font-family: inherit;
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 1000;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .footer.visible {
            transform: translateY(0);
        }

        .footer-left, .footer-right {
            color: rgb(7, 7, 7);
        }

        .footer a {
            color: #c82333;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer a:hover {
            color: #a71e2a;
            text-shadow: 0 0 5px rgba(200, 35, 51, 0.3);
        }

        /* Custom red X cursor */
        .red-x-cursor {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="%23c82333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'), auto;
        }

        .container {
            display: flex;
            height: 100vh;
            position: relative;
        }

        .main-content {
            width: 66.67%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .name {
            font-family: inherit;
            font-size: 7rem;
            font-weight: 400;
            color: rgb(7, 7, 7);
            text-shadow: 3px 3px 0px rgba(0, 0, 0, 0.3);
            letter-spacing: 4px;
            margin-bottom: 30px;
            text-transform: uppercase;
            line-height: 0.9;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M7 17l10-10M17 7H7v10" stroke="%23c82333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'), auto;
            text-decoration: none;
            transition: all 1s ease;
        }

        .name:hover {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M7 17l10-10M17 7H7v10" stroke="%23c82333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'), auto;
        }

        .name.clicked {
            color: #c82333;
            text-shadow: 3px 3px 0px rgba(0, 0, 0, 0.3), 0 0 10px rgba(200, 35, 51, 0.3);
        }

        .image-container {
            flex: 1;
            background: rgba(31, 31, 31, 0.92);
            backdrop-filter: blur(10px);
            border: 3px solid rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            transition: transform 0.3s ease;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="%23c82333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'), auto;
        }

        .image-container:hover {
            transform: translateY(-8px) translateX(-4px);
        }

        /* Add this new style for the actual image */
        .image-style {
            width: 100%;
            height: 100%;
            object-fit: cover; /* This makes the image fill the container while maintaining aspect ratio */
            object-position: center; /* Centers the image within the container */
            display: block;
        }

        .placeholder-image {
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #ff9a9e, #fecfef, #fecfef);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgb(7, 7, 7);
            font-family: inherit;
            font-size: 1.8rem;
            font-weight: 800;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sidebar {
            width: 33.33%;
            background: rgba(234, 234, 234, 0.3);
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            padding: 80px 30px;
        }

        .nav-tab {
            font-family: inherit;
            background: rgba(246, 246, 246, 0.913);
            border: 3px solid #060606;
            color: rgb(7, 7, 7);
            padding: 25px 30px;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="%23c82333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'), auto;
            transition: all 0.2s ease;
            font-size: 3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.8);
        }

        .nav-tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(174, 47, 47, 0.2), transparent);
            transition: left 0.5s;
        }

        .nav-tab:hover::before {
            left: 100%;
        }

        .nav-tab:hover {
            background: rgba(44, 43, 43, 0.699);
            border-color: rgba(205, 42, 42, 0.92);
            transform: translateX(-15px) translateY(-3px);
            box-shadow: 8px 8px 0px rgba(0,0,0,0.8);
        }

        .nav-tab:active {
            transform: translateX(-15px) translateY(-1px) scale(0.98);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.8);
        }

        /* Animated background elements */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.904);
            animation: float 6s ease-in-out infinite;
        }

        .shape1 {
            width: 100px;
            height: 100px;
            top: 20%;
            right: 10%;
            animation-delay: 0s;
        }

        .shape2 {
            width: 150px;
            height: 150px;
            top: 60%;
            right: 20%;
            animation-delay: 2s;
        }

        .shape3 {
            width: 80px;
            height: 80px;
            top: 40%;
            right: 5%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .font-switcher {
                top: 10px;
                right: 10px;
                gap: 5px;
            }
            
            .font-btn {
                padding: 6px 8px;
                font-size: 0.7rem;
                min-width: 60px;
            }
            
            body {
                overflow: auto;
            }
            
            .container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }
            
            .main-content {
                width: 100%;
                height: auto;
                padding: 20px 20px 0 20px;
                flex: none;
                order: 1;
                display: flex;
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: auto;
                flex-direction: column;
                justify-content: flex-start;
                padding: 20px;
                gap: 15px;
                order: 2; /* Navbar comes second */
            }
            
            .nav-tab {
                width: 100%;
                margin-right: 0;
                margin-bottom: 0;
                font-size: 2rem;
                padding: 10px;
            }
            
            .nav-tab.first {
                margin-top: 0;
            }
            
            .name {
                font-size: 4rem;
                margin-bottom: 20px;
                text-align: center;
                order: 1; /* Name comes first */
            }
            
            .image-container {
                height: 300px;
                margin-top: 20px;
                order: 3; /* Image comes last */
            }

            .footer {
                position: static;
                transform: translateY(0);
                margin-top: 20px;
                order: 4;
                justify-content: center;
                gap: 20px;
            }

            .footer-left, .footer-right {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Font Switcher -->
        <div class="font-switcher">
            <div class="font-btn active" onclick="changeFont('brutalist-1')">BRUT</div>
            <div class="font-btn" onclick="changeFont('brutalist-2')">BEBAS</div>
            <div class="font-btn" onclick="changeFont('brutalist-3')">OPS</div>
            <div class="font-btn" onclick="changeFont('brutalist-4')">BUNGY</div>
            <div class="font-btn" onclick="changeFont('artsy-1')">CREEP</div>
            <div class="font-btn" onclick="changeFont('artsy-3')">DANCE</div>
            <div class="font-btn" onclick="changeFont('artsy-4')">PACI</div>
            <div class="font-btn" onclick="changeFont('corporate-1')">INTER</div>
            <div class="font-btn" onclick="changeFont('corporate-2')">ROBO</div>
            <div class="font-btn" onclick="changeFont('corporate-4')">WORK</div>
            <div class="font-btn" onclick="changeFont('tech-1')">ORBIT</div>
            <div class="font-btn" onclick="changeFont('tech-2')">AUDIO</div>
            <div class="font-btn" onclick="changeFont('elegant-1')">PLAY</div>
            <div class="font-btn" onclick="changeFont('elegant-2')">CRIM</div>
        </div>

        <div class="main-content">
            <span class="name" onclick="openEmail()">
                Lauren Lien
            </span>
            <div class="image-container" onclick="nextImage()">
                <div class="placeholder-image">
                    Click to cycle through images
                </div>
            </div>
        </div>
        
        <div class="sidebar">
            <div class="nav-tab first" onclick="showTab('about')">About</div>
            <div class="nav-tab" onclick="showTab('audio')">Audio</div>
            <div class="nav-tab" onclick="showTab('poetry')">Poetry</div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer" id="footer">
        <div class="footer-left">
            <a href="mailto:lauren@example.com">Lauren Lien</a>
        </div>
        <div class="footer-right">
            Design by <a href="https://joshphythian.com" target="_blank">Josh</a>
        </div>
    </div>

    <script>
        let currentFont = 'brutalist-1';

        // Font switching functionality
        function changeFont(fontType) {
            // Remove current font class
            document.body.classList.remove(`font-${currentFont}`);
            
            // Add new font class
            currentFont = fontType;
            document.body.classList.add(`font-${fontType}`);
            
            // Update active button
            document.querySelectorAll('.font-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            console.log('Changed font to:', fontType);
        }

        // Initialize with default font
        document.body.classList.add('font-brutalist-1');

        // Email functionality for name
        function openEmail() {
            const nameElement = document.querySelector('.name');
            
            // Add the red color effect
            nameElement.classList.add('clicked');
            
            // Remove the red color after 1 second
            setTimeout(() => {
                nameElement.classList.remove('clicked');
            }, 1000);
            
            // Open email client
            window.location.href = 'mailto:lauren@example.com';
        }

        function showTab(tabName) {
            // Add a more brutal click feedback
            const clickedTab = event.target;
            clickedTab.style.transform = 'translateX(-15px) translateY(-1px) scale(0.95)';
            clickedTab.style.boxShadow = '4px 4px 0px rgba(0,0,0,0.8)';
            setTimeout(() => {
                clickedTab.style.transform = 'translateX(-15px) translateY(-3px)';
                clickedTab.style.boxShadow = '8px 8px 0px rgba(0,0,0,0.8)';
            }, 150);
            
            // Here you can add functionality to show different content
            console.log('Showing:', tabName);
            
            // Placeholder for future slideshow functionality
            if (tabName === 'about') {
                console.log('Loading about content...');
            } else if (tabName === 'audio') {
                console.log('Loading audio content...');
            } else if (tabName === 'poetry') {
                console.log('Loading poetry content...');
            }
        }

        // Add some interactive hover effects
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('mouseenter', function() {
                this.style.background = 'rgba(255, 255, 255, 0.25)';
            });
            
            tab.addEventListener('mouseleave', function() {
                this.style.background = 'rgba(255, 255, 255, 0.1)';
            });
        });

        // Image slideshow functionality with placeholder
        let currentImageIndex = 0;
        const placeholderTexts = [
            'Click to cycle through images',
            'Portfolio Image 1',
            'Portfolio Image 2', 
            'Portfolio Image 3'
        ];

        function nextImage() {
            currentImageIndex = (currentImageIndex + 1) % placeholderTexts.length;
            const imageContainer = document.querySelector('.image-container');
            const placeholderImage = document.querySelector('.placeholder-image');
            
            // Update placeholder text
            placeholderImage.textContent = placeholderTexts[currentImageIndex];
            
            // Add a subtle animation
            placeholderImage.style.transform = 'scale(0.95)';
            setTimeout(() => {
                placeholderImage.style.transform = 'scale(1)';
            }, 150);
            
            console.log('Switched to:', placeholderTexts[currentImageIndex]);
        }

        // Footer scroll functionality
        let hasScrolled = false;
        let scrollTimeout;

        function showFooter() {
            if (hasScrolled) {
                const footer = document.getElementById('footer');
                footer.classList.add('visible');
            }
        }

        function hideFooter() {
            const footer = document.getElementById('footer');
            footer.classList.remove('visible');
        }

        // Show footer only after scrolling
        function handleScroll() {
            if (!hasScrolled) {
                hasScrolled = true;
            }
            showFooter();
            
            // Hide footer after 3 seconds of no scrolling
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                hideFooter();
            }, 3000);
        }

        window.addEventListener('scroll', handleScroll);
        window.addEventListener('wheel', handleScroll);
        window.addEventListener('touchmove', handleScroll);
    </script>
</body>
</html>
