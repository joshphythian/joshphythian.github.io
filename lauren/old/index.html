<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lauren Lien</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #ececec;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            position: relative;
        }

        .main-content {
            width: 66.67%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .name {
            font-size: 4rem;
            font-weight: 900;
            color: rgb(7, 7, 7);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.041);
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .image-container {
            flex: 1;
            background: rgba(31, 31, 31, 0.92);
            /* border-radius: 20px; */
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            
            position: relative;
        }

        .image-container:hover {
            transform: translateY(-5px);
            /* box-shadow: 0 25px 50px rgba(0,0,0,0.2); */
        }

        .placeholder-image {
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #ff9a9e, #fecfef, #fecfef);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgb(7, 7, 7);
            font-size: 1.5rem;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .sidebar {
            width: 33.33%;
            background: rgba(234, 234, 234, 0.3);
            backdrop-filter: blur(15px);
            /* border-left: 1px solid rgba(255, 255, 255, 0.937); */
            display: flex;
            flex-direction: column;
            padding: 60px 30px;
        }

        .nav-tab {
            background: rgba(246, 246, 246, 0.913);
            border: 2px solid #060606;
            color: rgb(7, 7, 7);
            padding: 25px 30px;
            margin-bottom: 20px;
            /* border-radius: 15px; */
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.4rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .nav-tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(174, 47, 47, 0.2), transparent);
            transition: left 0.5s;
        }

        .nav-tab:hover::before {
            left: 100%;
        }

        .nav-tab:hover {
            background: rgba(44, 43, 43, 0.699);
            border-color: rgba(205, 42, 42, 0.92);
            transform: translateX(-10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .nav-tab:active {
            transform: translateX(-10px) scale(0.98);
        }

        .nav-tab.first {
            margin-top: 80px;
        }

        /* Animated background elements */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.904);
            animation: float 6s ease-in-out infinite;
        }

        .shape1 {
            width: 100px;
            height: 100px;
            top: 20%;
            right: 10%;
            animation-delay: 0s;
        }

        .shape2 {
            width: 150px;
            height: 150px;
            top: 60%;
            right: 20%;
            animation-delay: 2s;
        }

        .shape3 {
            width: 80px;
            height: 80px;
            top: 40%;
            right: 5%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            
            .main-content {
                width: 100%;
                height: 60vh;
                padding: 20px;
            }
            
            .sidebar {
                width: 100%;
                height: 40vh;
                flex-direction: row;
                padding: 20px;
                overflow-x: auto;
            }
            
            .nav-tab {
                min-width: 120px;
                margin-right: 15px;
                margin-bottom: 0;
                font-size: 1rem;
                padding: 20px;
            }
            
            .nav-tab.first {
                margin-top: 0;
            }
            
            .name {
                font-size: 2.5rem;
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Animated background shapes -->
        <div class="bg-shape shape1"></div>
        <div class="bg-shape shape2"></div>
        <div class="bg-shape shape3"></div>
        
        <div class="main-content">
            <h1 class="name">Lauren Lien</h1>
            <div class="image-container">
                <div class="placeholder-image">
                    Portfolio Image
                </div>
            </div>
        </div>
        
        <div class="sidebar">
            <div class="nav-tab first" onclick="showTab('about')">About</div>
            <div class="nav-tab" onclick="showTab('audio')">Audio</div>
            <div class="nav-tab" onclick="showTab('poetry')">Poetry</div>
        </div>
    </div>

    <script>
        function showTab(tabName) {
            // Add a subtle click feedback
            const clickedTab = event.target;
            clickedTab.style.transform = 'translateX(-10px) scale(0.95)';
            setTimeout(() => {
                clickedTab.style.transform = 'translateX(-10px)';
            }, 150);
            
            // Here you can add functionality to show different content
            console.log('Showing:', tabName);
            
            // Placeholder for future slideshow functionality
            if (tabName === 'about') {
                console.log('Loading about content...');
            } else if (tabName === 'audio') {
                console.log('Loading audio content...');
            } else if (tabName === 'poetry') {
                console.log('Loading poetry content...');
            }
        }

        // Add some interactive hover effects
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('mouseenter', function() {
                this.style.background = 'rgba(255, 255, 255, 0.25)';
            });
            
            tab.addEventListener('mouseleave', function() {
                this.style.background = 'rgba(255, 255, 255, 0.1)';
            });
        });

        // Future slideshow functionality placeholder
        let currentImage = 0;
        const images = []; // Will be populated with image URLs
        
        function nextSlide() {
            // Placeholder for slideshow functionality
            currentImage = (currentImage + 1) % images.length;
            console.log('Next slide:', currentImage);
        }
        
        function prevSlide() {
            // Placeholder for slideshow functionality
            currentImage = (currentImage - 1 + images.length) % images.length;
            console.log('Previous slide:', currentImage);
        }
    </script>
</body>
</html>
