<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Garamond, 'Times New Roman', serif;
            background: #7f1813;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #2a2a2a;
            overflow: hidden;
            position: relative;
        }

        .animated-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(255, 255, 255, 0.08) 0%, transparent 50%);
            animation: float 8s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(1deg); }
            50% { transform: translateY(-10px) rotate(0deg); }
            75% { transform: translateY(-30px) rotate(-1deg); }
        }

        .timer-container {
            background: #8e1b1544;
            backdrop-filter: none;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            min-width: 400px;
            z-index: 1;
            position: relative;
            /* Fixed height to prevent container resizing */
            height: 580px;  /* Increase this value, e.g., to 580px */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }   

        .time-display-area {
            /* Fixed height area for both input and display */
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .time-input {
            font-size: 4em;
            font-weight: 300;
            text-align: center;
            border: none;
            background: transparent;
            color: #2a2a2a;
            font-family: Garamond, 'Times New Roman', serif;
            width: 100%;
            outline: none;
            animation: displayGlow 3s ease-in-out infinite;
            caret-color: #2a2a2a;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .time-input::placeholder {
            color: rgba(42, 42, 42, 0.4);
            font-weight: 300;
        }

        @keyframes displayGlow {
            0%, 100% { text-shadow: 0 0 10px rgba(42, 42, 42, 0.3); }
            50% { text-shadow: 0 0 20px rgba(42, 42, 42, 0.6), 0 0 30px rgba(42, 42, 42, 0.4); }
        }

        .display {
            font-size: 4em;
            font-weight: 300;
            text-shadow: none;
            color: #2a2a2a;
            animation: displayGlow 3s ease-in-out infinite;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            white-space: nowrap;
        }

        .progress-ring {
            transform: rotate(-90deg);
            filter: drop-shadow(0 0 10px rgba(42, 42, 42, 0.3));
            display: block;
            margin: auto;
        }

        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            transform-origin: 50% 50%;
        }

        .progress-ring::after {
            content: '';
            display: block;
        }

        .controls {
            
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 25px;
            font-size: 1.1em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            min-width: 100px;
            font-family: Garamond, 'Times New Roman', serif;
        }

        .start-btn {
            background: rgba(255, 255, 255, 0.3);
            color: #2a2a2a;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 102, 102, 0.4);
            background: #777777;
        }

        .pause-btn {
            color: #2a2a2a;
            background: rgba(255, 255, 255, 0.3);
        }

        .pause-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 102, 102, 0.4);
            background: #777777;
        }

        .reset-btn {
            background: rgba(255, 255, 255, 0.3);
            color: #2a2a2a;
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 102, 102, 0.4);
            background: #777777;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .status {
            font-size: 1.2em;
            min-height: 30px;
            opacity: 0.8;
            color: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .finished {
            animation: finishedCelebration 2s ease-in-out infinite;
            color: #2a2a2a;
            font-weight: bold;
        }

        @keyframes finishedCelebration {
            0%, 100% { 
                opacity: 0.6; 
                transform: scale(1);
                text-shadow: 0 0 10px rgba(42, 42, 42, 0.5);
            }
            25% { 
                opacity: 1; 
                transform: scale(1.1);
                text-shadow: 0 0 20px rgba(42, 42, 42, 0.8);
            }
            50% { 
                opacity: 0.8; 
                transform: scale(1.05);
                text-shadow: 0 0 15px rgba(42, 42, 42, 0.6);
            }
            75% { 
                opacity: 1; 
                transform: scale(1.15);
                text-shadow: 0 0 25px rgba(42, 42, 42, 0.9);
            }
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 480px) {
            .timer-container {
                margin: 20px;
                padding: 30px 20px;
                min-width: auto;
                height: 460px;
            }

            .time-input,
            .display {
                font-size: 2.5em;
            }

            .controls {
                gap: 10px;
            }

            button {
                padding: 10px 20px;
                font-size: 1em;
                min-width: 80px;
            }
        }

    </style>
</head>
<body>
    <div class="animated-bg"></div>
    <div class="timer-container">
        <div class="time-display-area">
            <input type="text" class="time-input" id="timeInput" placeholder="00:01:30" maxlength="8">
            <div class="display hidden" id="display">00:00</div>
        </div>

        <svg class="progress-ring" width="200" height="200">
            <circle
                class="progress-ring__circle"
                stroke="rgba(255, 255, 255, 0.3)"
                stroke-width="8"
                fill="transparent"
                r="90"
                cx="100"
                cy="100"/>
            <circle
                class="progress-ring__circle"
                id="progress-circle"
                stroke="#4CAF50"
                stroke-width="8"
                fill="transparent"
                r="90"
                cx="100"
                cy="100"
                stroke-dasharray="565.48"
                stroke-dashoffset="565.48"/>
        </svg>

        <div class="controls">
            <button class="start-btn" id="startBtn">Start</button>
            <button class="pause-btn" id="pauseBtn" disabled>Pause</button>
            <button class="reset-btn" id="resetBtn">Reset</button>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script>
        class Timer {
            constructor() {
                this.totalSeconds = 0;
                this.remainingSeconds = 0;
                this.intervalId = null;
                this.isRunning = false;
                this.audioContext = null;
                
                this.initializeElements();
                this.initializeAudio();
                this.updateProgress();
                this.bindEvents();
            }

            initializeElements() {
                this.timeInput = document.getElementById('timeInput');
                this.display = document.getElementById('display');
                this.status = document.getElementById('status');
                this.startBtn = document.getElementById('startBtn');
                this.pauseBtn = document.getElementById('pauseBtn');
                this.resetBtn = document.getElementById('resetBtn');
                this.progressCircle = document.getElementById('progress-circle');
            }

            initializeAudio() {
                try {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.log('Audio not supported');
                }
            }

            playChime() {
                if (!this.audioContext) return;

                const oscillator1 = this.audioContext.createOscillator();
                const oscillator2 = this.audioContext.createOscillator();
                const gainNode = this.audioContext.createGain();

                oscillator1.connect(gainNode);
                oscillator2.connect(gainNode);
                gainNode.connect(this.audioContext.destination);

                oscillator1.frequency.setValueAtTime(523.25, this.audioContext.currentTime);
                oscillator2.frequency.setValueAtTime(659.25, this.audioContext.currentTime);

                oscillator1.type = 'sine';
                oscillator2.type = 'sine';

                gainNode.gain.setValueAtTime(0, this.audioContext.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.3, this.audioContext.currentTime + 0.01);
                gainNode.gain.exponentialRampToValueAtTime(0.001, this.audioContext.currentTime + 2);

                oscillator1.start(this.audioContext.currentTime);
                oscillator2.start(this.audioContext.currentTime);
                oscillator1.stop(this.audioContext.currentTime + 2);
                oscillator2.stop(this.audioContext.currentTime + 2);
            }

            bindEvents() {
                this.startBtn.addEventListener('click', () => this.start());
                this.pauseBtn.addEventListener('click', () => this.pause());
                this.resetBtn.addEventListener('click', () => this.reset());

                // Simplified input formatting that doesn't interfere with typing
                this.timeInput.addEventListener('blur', () => this.formatTimeInput());
                this.timeInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.formatTimeInput();
                        this.start();
                    }
                });

                // Enable audio context on first user interaction
                document.addEventListener('click', () => {
                    if (this.audioContext && this.audioContext.state === 'suspended') {
                        this.audioContext.resume();
                    }
                }, { once: true });
            }

            formatTimeInput() {
                let value = this.timeInput.value.replace(/[^0-9:]/g, '');
                
                if (!value || value === '') return;
                
                // If user entered just numbers, format them intelligently
                if (!value.includes(':')) {
                    const numValue = value.replace(/[^0-9]/g, '');
                    if (numValue.length <= 2) {
                        // Just seconds: "30" becomes "00:30"
                        this.timeInput.value = `00:${numValue.padStart(2, '0')}`;
                    } else if (numValue.length <= 4) {
                        // Minutes and seconds: "130" becomes "01:30"
                        const minutes = numValue.slice(0, -2);
                        const seconds = numValue.slice(-2);
                        this.timeInput.value = `${minutes.padStart(2, '0')}:${seconds}`;
                    } else if (numValue.length <= 6) {
                        // Hours, minutes, seconds: "10130" becomes "01:01:30"
                        const hours = numValue.slice(0, -4);
                        const minutes = numValue.slice(-4, -2);
                        const seconds = numValue.slice(-2);
                        this.timeInput.value = `${hours.padStart(2, '0')}:${minutes}:${seconds}`;
                    }
                } else {
                    // Already has colons, just clean it up
                    const parts = value.split(':');
                    if (parts.length === 2) {
                        // MM:SS format
                        const minutes = (parseInt(parts[0]) || 0).toString().padStart(2, '0');
                        const seconds = (parseInt(parts[1]) || 0).toString().padStart(2, '0');
                        this.timeInput.value = `${minutes}:${seconds}`;
                    } else if (parts.length === 3) {
                        // HH:MM:SS format
                        const hours = (parseInt(parts[0]) || 0).toString().padStart(2, '0');
                        const minutes = (parseInt(parts[1]) || 0).toString().padStart(2, '0');
                        const seconds = (parseInt(parts[2]) || 0).toString().padStart(2, '0');
                        this.timeInput.value = `${hours}:${minutes}:${seconds}`;
                    }
                }
            }

            parseTimeInput() {
                const timeStr = this.timeInput.value.trim();
                const parts = timeStr.split(':');
                
                if (parts.length === 2) {
                    // MM:SS format
                    const minutes = parseInt(parts[0]) || 0;
                    const seconds = parseInt(parts[1]) || 0;
                    return minutes * 60 + seconds;
                } else if (parts.length === 3) {
                    // HH:MM:SS format
                    const hours = parseInt(parts[0]) || 0;
                    const minutes = parseInt(parts[1]) || 0;
                    const seconds = parseInt(parts[2]) || 0;
                    return hours * 3600 + minutes * 60 + seconds;
                }
                return 0;
            }

            start() {
                this.formatTimeInput(); // Ensure input is properly formatted
                this.totalSeconds = this.parseTimeInput();
                this.remainingSeconds = this.totalSeconds;

                if (this.remainingSeconds > 0) {
                    this.isRunning = true;
                    this.timeInput.classList.add('hidden');
                    this.display.classList.remove('hidden');
                    this.startBtn.disabled = true;
                    this.pauseBtn.disabled = false;
                    this.status.textContent = '';
                    this.status.className = 'status';

                    this.updateDisplay();

                    this.intervalId = setInterval(() => {
                        this.remainingSeconds--;
                        this.updateDisplay();
                        this.updateProgress();

                        if (this.remainingSeconds <= 0) {
                            this.finish();
                        }
                    }, 1000);
                } else {
                    this.status.textContent = 'Please enter a valid time';
                }
            }

            pause() {
                this.isRunning = false;
                this.startBtn.disabled = false;
                this.pauseBtn.disabled = true;
                this.status.textContent = '';
                this.status.className = 'status';
                
                if (this.intervalId) {
                    clearInterval(this.intervalId);
                    this.intervalId = null;
                }
            }

            reset() {
                this.pause();
                this.timeInput.classList.remove('hidden');
                this.display.classList.add('hidden');
                this.remainingSeconds = 0;
                this.totalSeconds = 0;
                this.updateProgress();
                this.status.textContent = '';
                this.status.className = 'status';
            }

            finish() {
                this.pause();
                this.status.textContent = '';
                this.status.className = 'status finished';
                this.playChime();
            }

            updateDisplay() {
                const hours = Math.floor(this.remainingSeconds / 3600);
                const minutes = Math.floor((this.remainingSeconds % 3600) / 60);
                const seconds = this.remainingSeconds % 60;

                let timeString = '';
                if (hours > 0) {
                    timeString = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                } else {
                    timeString = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                }

                this.display.textContent = timeString;
            }

            updateProgress() {
                if (this.totalSeconds === 0) {
                    this.progressCircle.style.strokeDashoffset = 565.48;
                    return;
                }

                const progress = (this.totalSeconds - this.remainingSeconds) / this.totalSeconds;
                const circumference = 565.48;
                const offset = circumference - (progress * circumference);
                this.progressCircle.style.strokeDashoffset = offset;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new Timer();
        });
    </script>
</body>
</html>
