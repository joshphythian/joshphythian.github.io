    <style>
        body {
            background-color: #007BA7;
            background-size: 20px 20px;
            margin: 0;
        }
        .animated-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                /* radial-gradient(circle at 20% 30%, #007aa708 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, #007aa709 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, #007aa712 0%, transparent 50%); */
                radial-gradient(circle at 20% 30%, #007BA7 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, #007BA7 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, #007BA7 0%, transparent 50%);
            animation: float 8s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(1deg); }
            50% { transform: translateY(-10px) rotate(0deg); }
            75% { transform: translateY(-30px) rotate(-1deg); }
        }
